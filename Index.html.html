<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لعبة المقارنة بين عددين | جنات شروف</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f7f4ff;color:#29233d}main{max-width:700px;margin:auto;padding:24px}.card{background:white;border-radius:24px;padding:28px;box-shadow:0 8px 30px #0001;text-align:center}h1{color:#6b4eff}.nums{display:flex;justify-content:center;gap:18px;align-items:center;margin:25px 0}.num{font-size:48px;font-weight:bold;border:2px solid #ddd;border-radius:18px;padding:18px 30px}.buttons button,.primary{font-size:24px;padding:12px 22px;margin:7px;border:0;border-radius:14px;background:#eee;cursor:pointer}.primary{font-size:18px;background:#6b4eff;color:white}.hidden{display:none}.ok{color:#16803b}.bad{color:#b42318}.cert{border:4px double #6b4eff;padding:24px;border-radius:18px;margin-top:20px}.muted{color:#777}</style></head><body><main><div class="card"><section id="start"><h1>🎯 لعبة المقارنة بين عددين</h1><p>للصف الثاني الأساسي</p><p>أدخلي اسم الطالبة:</p><input id="name" style="font-size:18px;padding:12px;border-radius:10px;border:1px solid #ccc;text-align:center" placeholder="اسم الطالبة"><p class="muted">١٠ أسئلة تشمل: أكبر من &gt; ، أصغر من &lt; ، يساوي =</p><button class="primary" onclick="start()">ابدئي اللعبة 🚀</button><p class="muted">إعداد المعلمة: جنات شروف 🌷</p></section><section id="game" class="hidden"><p id="qn"></p><div class="nums"><div class="num" id="a"></div><b>؟</b><div class="num" id="b"></div></div><div class="buttons"><button onclick="answer('>')">&gt;</button><button onclick="answer('<')">&lt;</button><button onclick="answer('=')">=</button></div><h3 id="msg"></h3><button class="primary" onclick="next()">السؤال التالي ➡️</button></section><section id="result" class="hidden"><h1>🎉 انتهت اللعبة!</h1><div id="res"></div><div id="cert" class="cert hidden"></div><button class="primary" onclick="location.reload()">لعبة جديدة 🔄</button></section></div></main><script>let n='',i=0,s=0,a,b,done=false;const ar=x=>String(x).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);function start(){n=document.getElementById('name').value.trim();if(!n)return alert('اكتبي اسم الطالبة أولاً');document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');q()}function q(){done=false;let t=i%3;if(t===0){a=Math.floor(Math.random()*80)+11;b=Math.floor(Math.random()*(a-1))+1}else if(t===1){b=Math.floor(Math.random()*80)+11;a=b+Math.floor(Math.random()*15)+1;if(a>99)a=99}else{a=Math.floor(Math.random()*90)+10;b=a}document.getElementById('a').textContent=ar(a);document.getElementById('b').textContent=ar(b);document.getElementById('qn').textContent='السؤال '+ar(i+1)+' من ١٠';document.getElementById('msg').textContent=''}function answer(x){if(done)return;done=true;let c=a>b?'>':a<b?'<':'=';let m=document.getElementById('msg');if(x===c){s++;m.className='ok';m.textContent='⭐ أحسنتِ! إجابة صحيحة'}else{m.className='bad';m.textContent='💡 حاولي الانتباه إلى العددين'} }function next(){if(!done)return;if(i===9){finish()}else{i++;q()}}function finish(){document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let p=s*10;document.getElementById('res').innerHTML='<h2>'+n+'</h2><p>علامتك: <b>'+ar(s)+' من ١٠</b></p><p>النسبة: <b>'+ar(p)+'٪</b></p><p>التقدير: <b>'+(p>=90?'ممتازة 🏆':p>=80?'جيد جدًا ⭐':p>=70?'جيد 🌷':'تحتاج إلى تدريب 💪')+'</b></p>';if(p>=90){let c=document.getElementById('cert');c.classList.remove('hidden');c.innerHTML='<h2>🏆 شهادة تقدير 🏆</h2><p>تُمنح للطالبة</p><h2>'+n+'</h2><p>لحصولها على تقدير <b>ممتازة</b> في لعبة المقارنة بين عددين.</p><p>أكبر من &gt; — أصغر من &lt; — يساوي =</p><p class="muted">إعداد المعلمة: جنات شروف 🌷</p>'}}</script></body></html>
